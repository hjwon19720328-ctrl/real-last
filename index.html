<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페르소나 메이커 - 시안송 제작</title>
  <style>
    :root {
      --bg-color: #121118;
      --panel-bg: #1a1926;
      --panel-border: #383258;
      --accent-color: #a970ff;
      --accent-hover: #9146ff;
      --text-color: #e2e0eb;
      --text-muted: #9b96b0;
      --input-bg: #14131f;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Pretendard', sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* 상단 BGM 컨트롤 버튼 (우측 상단) */
    .audio-control {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      box-shadow: 0 0 10px rgba(169, 112, 255, 0.3);
      z-index: 1000;
      transition: all 0.2s;
    }
    .audio-control:hover {
      background: var(--accent-color);
      color: #fff;
    }

    .header-container {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: 2.2rem;
      color: #fff;
      text-shadow: 0 0 12px rgba(169, 112, 255, 0.5);
    }

    .subtitle {
      margin-top: 5px;
      color: var(--text-muted);
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }

    /* 스텝 표시 바 */
    .step-indicator {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 15px;
    }

    .step-dot {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: bold;
    }
    .step-dot.active {
      color: var(--accent-color);
      text-shadow: 0 0 8px rgba(169, 112, 255, 0.4);
    }

    .step-content {
      display: none;
    }
    .step-content.active {
      display: block;
    }

    h2 {
      margin-top: 0;
      color: var(--accent-color);
      font-size: 1.4rem;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      background: var(--input-bg);
      color: #fff;
      box-sizing: border-box;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-color);
    }

    .custom-input {
      margin-top: 8px;
      display: none;
    }
    .custom-input.show {
      display: block;
    }

    textarea {
      height: 90px;
      resize: vertical;
    }

    /* 태그 선택 그리드 */
    .tag-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .tag-btn {
      background: var(--input-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      text-align: center;
      transition: all 0.2s;
    }

    .tag-btn.selected {
      background: rgba(169, 112, 255, 0.2);
      border-color: var(--accent-color);
      color: #fff;
      font-weight: bold;
    }

    .btn-container {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      gap: 10px;
    }

    button.primary-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      flex: 1;
      transition: background 0.2s;
    }

    button.primary-btn:hover {
      background: var(--accent-hover);
    }

    button.secondary-btn {
      background: #323048;
      color: var(--text-color);
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }

    button.secondary-btn:hover {
      background: #464366;
    }

    button.danger-btn {
      background: #5c2020;
      color: #ff9999;
      border: 1px solid #ff4d4d;
    }
    button.danger-btn:hover {
      background: #7a2b2b;
    }

    /* 출력 영역 */
    .output-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    .tab-btn {
      background: var(--input-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .tab-btn.active {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-bg);
      color: var(--accent-color);
      font-weight: bold;
    }

    #output-box {
      width: 100%;
      height: 320px;
      background: #0d0c14;
      border: 1px solid var(--panel-border);
      border-radius: 0 8px 8px 8px;
      padding: 15px;
      color: #dcd9ec;
      font-family: monospace;
      white-space: pre-wrap;
      overflow-y: auto;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- BGM 오디오 및 토글 버튼 -->
  <audio id="bgm" src="Carnival of Cracked Glass.mp3" loop autoplay></audio>
  <button class="audio-control" id="audioToggleBtn" onclick="toggleAudio()">🔊 음악 켜짐</button>

  <div class="header-container">
    <h1>페르소나 메이커</h1>
    <div class="subtitle">시안송 제작</div>
  </div>

  <div class="container">
    <!-- 단계 표시 바 -->
    <div class="step-indicator">
      <span class="step-dot active" id="dot-1">1. 기본 정체성</span>
      <span class="step-dot" id="dot-2">2. 세계관 선택</span>
      <span class="step-dot" id="dot-3">3. 속성 및 설정</span>
      <span class="step-dot" id="dot-4">4. 최종 확인 및 출력</span>
    </div>

    <!-- Step 1: 기본 정체성 -->
    <div class="step-content active" id="step-1">
      <h2>👤 기본 정보 입력</h2>
      <div class="form-group">
        <label>캐릭터 이름 / 별칭</label>
        <input type="text" id="charName" placeholder="예: 카린, 루시퍼, 실버 블레이드">
      </div>
      <div class="form-group">
        <label>성별</label>
        <select id="charGender">
          <option value="여성">여성</option>
          <option value="남성">남성</option>
          <option value="논바이너리 / 무성">논바이너리 / 무성</option>
          <option value="기타">기타 (직접 입력)</option>
        </select>
        <input type="text" id="charGenderCustom" class="custom-input" placeholder="성별 직접 입력">
      </div>
      <div class="btn-container">
        <button class="primary-btn" onclick="nextStep(2)">다음으로 ➡</button>
      </div>
    </div>

    <!-- Step 2: 세계관 선택 -->
    <div class="step-content" id="step-2">
      <h2>🌍 세계관 선택</h2>
      <div class="form-group">
        <label>플레이할 세계관 장르</label>
        <select id="worldview" onchange="updateWorldviewFields()">
          <option value="정통 판타지">정통 판타지 (검과 마법)</option>
          <option value="이세계/퓨전">이세계 / 퓨전 판타지</option>
          <option value="현대/학원물">현대 / 학원물</option>
          <option value="어반 판타지">어반 판타지 (현대 초능력/괴이)</option>
          <option value="사이버펑크/SF">사이버펑크 / SF</option>
          <option value="스팀펑크/가슬램프">스팀펑크 / 가슬램프</option>
          <option value="다크 판타지">다크 판타지 / 고딕</option>
          <option value="포스트 아포칼립스">포스트 아포칼립스 / 생존</option>
          <option value="무협/선협">무협 / 선협</option>
          <option value="오컬트/미스터리">오컬트 / 미스터리</option>
          <option value="스페이스 오페라">스페이스 오페라</option>
          <option value="신화/천계">신화 / 천계</option>
        </select>
      </div>
      <div class="btn-container">
        <button class="secondary-btn" onclick="prevStep(1)">⬅ 이전</button>
        <button class="primary-btn" onclick="nextStep(3)">다음으로 ➡</button>
      </div>
    </div>

    <!-- Step 3: 속성 및 설정 (종족, 능력, 성격, 말투, 과거사 등) -->
    <div class="step-content" id="step-3">
      <h2>⚡ 세부 설정 및 생성 모드</h2>

      <div class="form-group">
        <label>생성 모드</label>
        <select id="creationMode" onchange="toggleMode()">
          <option value="manual">직접 선택 모드</option>
          <option value="random">완전 랜덤 모드</option>
          <option value="mix">하이브리드 (반반 믹스)</option>
        </select>
      </div>

      <!-- 동적 필드 영역 -->
      <div class="form-group">
        <label id="label-race">종족 / 형태</label>
        <select id="fieldRace" onchange="checkCustom('fieldRace', 'fieldRaceCustom')">
          <!-- JS로 동적 생성 -->
        </select>
        <input type="text" id="fieldRaceCustom" class="custom-input" placeholder="종족 직접 입력">
      </div>

      <div class="form-group">
        <label id="label-class">직업 / 포지션</label>
        <select id="fieldClass" onchange="checkCustom('fieldClass', 'fieldClassCustom')">
          <!-- JS로 동적 생성 -->
        </select>
        <input type="text" id="fieldClassCustom" class="custom-input" placeholder="직업 직접 입력">
      </div>

      <div class="form-group">
        <label id="label-ability">특수 능력 / 마법</label>
        <select id="fieldAbility" onchange="checkCustom('fieldAbility', 'fieldAbilityCustom')">
          <!-- JS로 동적 생성 -->
        </select>
        <input type="text" id="fieldAbilityCustom" class="custom-input" placeholder="능력 직접 입력">
      </div>

      <div class="form-group">
        <label id="label-faction">소속 진영 / 조직</label>
        <select id="fieldFaction" onchange="checkCustom('fieldFaction', 'fieldFactionCustom')">
          <!-- JS로 동적 생성 -->
        </select>
        <input type="text" id="fieldFactionCustom" class="custom-input" placeholder="소속 직접 입력">
      </div>

      <!-- 성격 태그 -->
      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <label style="margin:0;">성격 태그 (다중 선택 가능)</label>
          <button type="button" class="secondary-btn" style="padding:4px 10px; font-size:0.75rem;" onclick="randomizeTags()">🎲 성격 랜덤 추천</button>
        </div>
        <div class="tag-grid" id="personalityTags">
          <!-- JS 렌더링 -->
        </div>
      </div>

      <!-- 말투 선택 -->
      <div class="form-group">
        <label>말투 및 어조 스타일</label>
        <select id="speechStyleSelect" onchange="checkCustom('speechStyleSelect', 'speechStyleCustom')">
          <option value="냉철하고 건조한 반말 (예: '…필요 없는 참견이야.')">냉철하고 건조한 반말</option>
          <option value="능글맞고 여유로운 말투 (예: '어라, 벌써 도망치려는 거야?')">능글맞고 여유로운 말투</option>
          <option value="까칠하고 툴툴거리는 츤데레 (예: '바보야, 네가 걱정돼서 그런 거거든!')">까칠한 츤데레</option>
          <option value="예의 바르고 격식 있는 존댓말 (예: '제가 직접 처리해 드리겠습니다.')">예의 바른 존댓말</option>
          <option value="광기 서린 장난스러운 어조 (예: '키히하! 이번엔 어떤 소리를 낼래?')">광기 서린 장난</option>
          <option value="과묵하고 무뚝뚝한 단답형 (예: '…응.', '맡겨.')">무뚝뚝한 단답형</option>
          <option value="밝고 활기찬 분위기 메이커 (예: '헤헤, 걱정 마! 내가 다 해결할 수 있어!')">밝고 활기찬 어조</option>
          <option value="우아하고 고풍스러운 말투 (예: '후훗, 이 정도 품위는 지켜야지요.')">우아하고 고풍스러움</option>
          <option value="기타">기타 (직접 입력)</option>
        </select>
        <input type="text" id="speechStyleCustom" class="custom-input" placeholder="말투 및 대사 예시 직접 입력">
      </div>

      <!-- 과거사 / 배경 스토리 -->
      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <label style="margin:0;">과거사 및 비밀 설정</label>
          <button type="button" class="secondary-btn" style="padding:4px 10px; font-size:0.75rem;" onclick="randomizeBackstory()">🎲 과거사 랜덤 생성</button>
        </div>
        <textarea id="backstory" placeholder="캐릭터의 숨겨진 과거나 목적을 입력하세요 (또는 위 랜덤 버튼 클릭)"></textarea>
      </div>

      <div class="btn-container">
        <button class="secondary-btn" onclick="prevStep(2)">⬅ 이전</button>
        <button class="primary-btn" onclick="generatePersona(); nextStep(4);">페르소나 생성 완료 🚀</button>
      </div>
    </div>

    <!-- Step 4: 결과 확인 및 출력 -->
    <div class="step-content" id="step-4">
      <h2>📋 완성된 페르소나 시트</h2>
      
      <div class="output-tabs">
        <button class="tab-btn active" onclick="switchTab('basic', this)">기본 포맷</button>
        <button class="tab-btn" onclick="switchTab('markdown', this)">마크다운 (MD)</button>
        <button class="tab-btn" onclick="switchTab('tavern', this)">AI / 실리테베른용</button>
      </div>

      <div id="output-box"></div>

      <div class="btn-container" style="flex-wrap: wrap;">
        <button class="primary-btn" onclick="copyOutput()">📋 클립보드 복사</button>
        <button class="secondary-btn" onclick="prevStep(3)">⚙️ 수정하기</button>
        <button class="danger-btn" onclick="restartAll()">🔄 다시 만들기</button>
      </div>
    </div>

  </div>

  <script>
    // BGM 오디오 플레이어 제어
    const bgm = document.getElementById('bgm');
    let isPlaying = true;
    bgm.volume = 0.4;

    function toggleAudio() {
      const btn = document.getElementById('audioToggleBtn');
      if (isPlaying) {
        bgm.pause();
        isPlaying = false;
        btn.innerText = "🔇 음악 꺼짐";
      } else {
        bgm.play().then(() => {
          isPlaying = true;
          btn.innerText = "🔊 음악 켜짐";
        }).catch(e => console.log("Audio play blocked:", e));
      }
    }

    // 성격 태그 목록
    const personalityList = [
      "냉철함", "따뜻함", "츤데레", "얀데레", "능글맞음", "무뚝뚝",
      "광기", "겁많음", "정의로움", "자유분방", "계산적", "장난기",
      "시크함", "나사빠짐", "집착적", "다정다감", "신중함", "호전적",
      "엉뚱함", "잔인함", "순진함", "비관적", "낙천적", "리더십"
    ];

    // 세계관별 맞춤형 프리셋 데이터
    const worldviewPresets = {
      "정통 판타지": {
        race: ["인간", "엘프", "드워프", "수인", "하프 드래곤", "마족", "정령", "기타"],
        class: ["전사", "정통 마법사", "성기사", "궁수", "암살자", "흑마법사", "사제", "기타"],
        ability: ["정령 마법", "오라 검술", "신성력", "드래곤 브레스", "무한 재생", "그림자 조종", "기타"],
        faction: ["왕실 기사단", "마법 길드", "모험가 연맹", "종교 재판소", "방랑자", "기타"]
      },
      "이세계/퓨전": {
        race: ["전생자 (인간)", "마왕족", "상급 정령", "이세계 용사", "고양이귀 수인", "기타"],
        class: ["치트 스킬 보유자", "현자", "대장장이", "암살자", "연금술사", "기타"],
        ability: ["아이템 창고", "상태창 감지", "스킬 복사", "절대 방어", "시간 정지", "기타"],
        faction: ["용사 파티", "마왕군", "모험가 길드", "자영업자", "기타"]
      },
      "현대/학원물": {
        race: ["평범한 인간", "초능력 각성자", "퇴마사 가문", "반요(인간 혼혈)", "기타"],
        class: ["고등학생", "대학생", "학생회장", "불량학생", "전학생", "알바생", "기타"],
        ability: ["염동력", "독심술", "미래 예지", "신체 강화", "기억 조작", "기타"],
        faction: ["학생회", "선도부", "방과후 귀신퇴치부", "평범한 동아리", "기타"]
      },
      "어반 판타지": {
        race: ["인간", "도시 뱀파이어", "길고양이 수인", "도시 요정", "타락천사", "기타"],
        class: ["심부름센터장", "사설 탐정", "뒷골목 능력자", "퇴마 경찰", "기타"],
        ability: ["그림자 이동", "도시 전자기기 조작", "환술", "흡혈", "기타"],

        class: ["우주 해적", "함선 파일럿", "성간 용병", "외교관", "기타"],
        ability: ["중력 제어", "텔레파시", "광선검 전투", "함선 시스템 링킹", "기타"],
        faction: ["성간 연방", "우주 해적 연합", "은하 은둔 세력", "기타"]

      "신화/천계": {
        race: ["천사", "타천사", "반신반인(데미갓)", "신수", "기타"],
        class: ["천계 집행관", "신탁의 무녀", "지옥의 파수꾼", "방랑 신선", "기타"],
        ability: ["신성 빛의 창", "천벌 소환", "기적 치유", "불멸의 부활", "기타"],
        faction: ["천계 의회", "지옥 군단", "지상 인간계", "기타"]
      }
    };

    // 과거사 랜덤 목록 (대폭 증가)
    const backstoryPresets = [
      "실험체로 살아가다 탈출하여 거대 조직의 추적을 피해 도망치고 있다.",
      "평화로운 마을이 괴물들에게 불타버린 후 복수를 위해 검을 쥐었다.",
      "기억을 잃은 채 낯선 골목에서 눈을 떴으며, 손에 쥐인 부서진 회중시계만이 유일한 단서다.",
      "한때 최정예 부대의 지휘관이었으나, 동료의 배신으로 모든 명예를 잃고 추방당했다.",
      "금지된 마법을 연구하다 세상에서 이단자로 낙인찍혀 그림자 속에서 살아간다.",
      "우연히 고대 신의 유물을 건드리는 바람에 영혼 일부가 그와 결합해 버렸다.",
      "평범한 일상을 보내던 중 갑작스러운 이세계 전이 휘말려 이 곳에 떨어졌다.",
      "가문의 저주 때문에 매일 밤 악몽과 싸우며 저주의 근원을 찾고 있다.",
      "범죄 조직의 은밀한 해결사로 자라났으나, 마지막 의뢰에서 양심의 가책을 느껴 조직을 배신했다.",
      "세상의 진실을 파헤치려다 거대한 음모에 휘말려 모든 것을 잃은 고독한 방랑자."
    ];

    // 초기화 및 태그 렌더링
    window.onload = function() {
      renderTags();
      updateWorldviewFields();
    };

    function renderTags() {
      const container = document.getElementById('personalityTags');
      container.innerHTML = '';
      personalityList.forEach(tag => {
        const btn = document.createElement('div');
        btn.className = 'tag-btn';
        btn.innerText = tag;
        btn.onclick = () => btn.classList.toggle('selected');
        container.appendChild(btn);
      });
    }

    function updateWorldviewFields() {
      const wv = document.getElementById('worldview').value;
      const data = worldviewPresets[wv] || worldviewPresets["정통 판타지"];

      populateSelect('fieldRace', data.race, 'fieldRaceCustom');
      populateSelect('fieldClass', data.class, 'fieldClassCustom');
      populateSelect('fieldAbility', data.ability, 'fieldAbilityCustom');
      populateSelect('fieldFaction', data.faction, 'fieldFactionCustom');
    }

    function populateSelect(selectId, items, customInputId) {
      const select = document.getElementById(selectId);
      select.innerHTML = '';
      items.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        opt.innerText = item;
        select.appendChild(opt);
      });
      // 항상 맨 뒤에 기타 추가
      const optCustom = document.createElement('option');
      optCustom.value = "기타";
      optCustom.innerText = "기타 (직접 입력)";
      select.appendChild(optCustom);

      checkCustom(selectId, customInputId);
    }

    function checkCustom(selectId, customInputId) {
      const select = document.getElementById(selectId);
      const customInput = document.getElementById(customInputId);
      if (select.value === "기타") {
        customInput.classList.add('show');
      } else {
        customInput.classList.remove('show');
        customInput.value = '';
      }
    }

    function toggleMode() {
      const mode = document.getElementById('creationMode').value;
      if (mode === 'random') {
        // 랜덤 모드일 때 자동 채우기 시뮬레이션
        randomizeAllFields();
      }
    }

    function randomizeTags() {
      const buttons = document.querySelectorAll('.tag-btn');
      buttons.forEach(b => b.classList.remove('selected'));
      // 무작위로 2~4개 선택
      const count = Math.floor(Math.random() * 3) + 2;
      for (let i = 0; i < count; i++) {
        const randIndex = Math.floor(Math.random() * buttons.length);
        buttons[randIndex].classList.add('selected');
      }
    }

    function randomizeBackstory() {
      const randText = backstoryPresets[Math.floor(Math.random() * backstoryPresets.length)];
      document.getElementById('backstory').value = randText;
    }

    function randomizeAllFields() {
      const selects = ['fieldRace', 'fieldClass', 'fieldAbility', 'fieldFaction'];
      selects.forEach(id => {
        const sel = document.getElementById(id);
        const opts = sel.options;
        const randIdx = Math.floor(Math.random() * (opts.length - 1)); // '기타' 제외
        sel.selectedIndex = randIdx;
        checkCustom(id, id + 'Custom');
      });
      randomizeTags();
      randomizeBackstory();
    }

    // 스텝 네비게이션
    function nextStep(step) {
      // 성별 기타 체크 확인
      if (step === 2) {
        const gender = document.getElementById('charGender').value;
        const genderCustom = document.getElementById('charGenderCustom').value;
        if (gender === "기타" && !genderCustom.trim()) {
          alert("성별을 직접 입력해주세요!");
          return;
        }
      }

      document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
      document.getElementById(`step-${step}`).classList.add('active');
      updateDots(step);
    }

    function prevStep(step) {
      document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
      document.getElementById(`step-${step}`).classList.add('active');
      updateDots(step);
    }

    function updateDots(step) {
      for (let i = 1; i <= 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i === step) dot.classList.add('active');
        else dot.classList.remove('active');
      }
    }

    // 값 가져오기 헬퍼 (기타 처리 포함)
    function getValueOrCustom(selectId, customId) {
      const sel = document.getElementById(selectId);
      if (sel.value === "기타") {
        const customVal = document.getElementById(customId).value.trim();
        return customVal || "미지정";
      }
      return sel.value;
    }

    let generatedDataText = "";

    function generatePersona() {
      const name = document.getElementById('charName').value.trim() || "이름 없음";
      const gender = document.getElementById('charGender').value === "기타" ? document.getElementById('charGenderCustom').value.trim() || "기타" : document.getElementById('charGender').value;
      const worldview = document.getElementById('worldview').value;
      
      const race = getValueOrCustom('fieldRace', 'fieldRaceCustom');
      const cls = getValueOrCustom('fieldClass', 'fieldClassCustom');
      const ability = getValueOrCustom('fieldAbility', 'fieldAbilityCustom');
      const faction = getValueOrCustom('fieldFaction', 'fieldFactionCustom');

      // 선택된 태그 모으기
      const selectedTags = [];
      document.querySelectorAll('.tag-btn.selected').forEach(b => selectedTags.push(b.innerText));
      const tagsStr = selectedTags.length > 0 ? selectedTags.join(', ') : "특징 없음";

      const speechSelect = document.getElementById('speechStyleSelect');
      let speech = speechSelect.value;
      if (speech === "기타") {
        speech = document.getElementById('speechStyleCustom').value.trim() || "기본 대화 스타일";
      }

      const backstory = document.getElementById('backstory').value.trim() || "알려지지 않은 과거";

      // 1. 기본 포맷
      window.formatBasic = `[캐릭터 프로필: ${name}]
- 장르/세계관: ${worldview}
- 성별: ${gender}
- 종족: ${race}
- 직업/포지션: ${cls}
- 특수 능력: ${ability}
- 소속 진영: ${faction}
- 성격 특징: ${tagsStr}
- 말투 및 어조: ${speech}
- 과거사/배경: ${backstory}`;

      // 2. 마크다운 포맷
      window.formatMarkdown = `# 🎭 ${name} 페르소나 시트

### 📌 기본 정보
- **세계관**: ${worldview}
- **성별**: ${gender}
- **종족**: ${race}
- **직업**: ${cls}

### ⚡ 능력 및 소속
- **특수 능력**: ${ability}
- **소속 진영**: ${faction}

### 🧩 성격 & 말투
- **성격 키워드**: ${tagsStr}
- **말투/대사**: ${speech}

### 📜 배경 스토리
> ${backstory}`;

      // 3. AI / 실리테베른 포맷
      window.formatTavern = `[Character Sheet: ${name}]
World: ${worldview}
Gender: ${gender}
Race: ${race}
Class: ${cls}
Ability: ${ability}
Faction: ${faction}
Personality: ${tagsStr}
Speech Style: ${speech}
Background: ${backstory}

[Dialogue Example]
User: "너는 누구지?"
${name}: "${speech.includes("예:") ? speech.split("예:")[1].replace(/[']/g, "").trim() : "..."}"`;

      // 기본값으로 출력 설정
      switchTab('basic', document.querySelector('.tab-btn'));
    }

    let currentTabFormat = 'basic';
    function switchTab(type, btnElement) {
      currentTabFormat = type;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');

      const box = document.getElementById('output-box');
      if (type === 'basic') box.innerText = window.formatBasic;
      else if (type === 'markdown') box.innerText = window.formatMarkdown;
      else if (type === 'tavern') box.innerText = window.formatTavern;
    }

    function copyOutput() {
      const box = document.getElementById('output-box');
      navigator.clipboard.writeText(box.innerText).then(() => {
        alert("클립보드에 복사되었습니다!");
      });
    }

    // 다시 만들기(초기화) 버튼 완전 수정 구현
    function restartAll() {
      if (!confirm("작성 중인 내용이 모두 초기화됩니다. 처음부터 다시 만드시겠습니까?")) return;

      // 1. 입력 필드 초기화
      document.getElementById('charName').value = '';
      document.getElementById('charGender').selectedIndex = 0;
      document.getElementById('charGenderCustom').value = '';
      document.getElementById('charGenderCustom').classList.remove('show');

      document.getElementById('worldview').selectedIndex = 0;
      updateWorldviewFields();

      document.getElementById('creationMode').selectedIndex = 0;
      
      // 태그 선택 해제
      document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('selected'));

      // 말투 초기화
      document.getElementById('speechStyleSelect').selectedIndex = 0;
      document.getElementById('speechStyleCustom').value = '';
      document.getElementById('speechStyleCustom').classList.remove('show');

      // 과거사 초기화
      document.getElementById('backstory').value = '';

      // 출력 상자 초기화
      document.getElementById('output-box').innerText = '';

      // 2. Step 1으로 이동
      document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
      document.getElementById('step-1').classList.add('active');
      updateDots(1);
    }
  </script>
